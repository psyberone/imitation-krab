[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imitation-krab"
version = "0.2.0"
description = "A local, scoped work mailbox for cooperating software agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "imitation_krab contributors" }]
dependencies = []

[project.scripts]
krab = "imitation_krab.cli:main"
krabd = "imitation_krab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
